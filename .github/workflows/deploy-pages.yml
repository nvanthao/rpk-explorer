name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than
# canceling it, since it may already be live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # --base matches this repo's Pages URL (a project site is served
        # from /<repo-name>/, not the domain root), so built asset paths
        # and the runtime data.json fetch (see src/App.vue's use of
        # import.meta.env.BASE_URL) resolve correctly. Calling vue-tsc and
        # vite directly, rather than `pnpm run build -- --base=...`, since
        # pnpm's arg-forwarding mangles --base across the `&&`-chained
        # build script and it silently falls back to the default base.
        run: |
          pnpm exec vue-tsc -b
          pnpm exec vite build --base=/rpk-explorer/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
