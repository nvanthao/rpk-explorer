name: Update rpk command tree

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpk
        run: |
          curl -LO https://github.com/redpanda-data/redpanda/releases/latest/download/rpk-linux-amd64.zip
          mkdir -p "$HOME/.local/bin"
          unzip rpk-linux-amd64.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install rpk-managed plugins
        # rpk connect is a managed plugin, not part of the bare rpk binary —
        # without installing it first, --print-tree omits its entire
        # subtree. See:
        # https://docs.redpanda.com/connect/get-started/quickstarts/rpk/
        #
        # rpk cloud byoc is also a managed plugin, but every byoc subcommand
        # (install, aws/azure/gcp validate, etc.) requires a valid Redpanda
        # Cloud auth token before it will even download the plugin, which
        # isn't available here. The whole rpk cloud command is restored
        # below from a fragment extracted locally instead — see
        # data-fragments/README.md.
        run: |
          rpk connect install

      - name: Regenerate data.json
        run: rpk --print-tree > public/data.json

      - name: Merge in locally-extracted rpk cloud fragment
        run: |
          if [ -f data-fragments/cloud.json ]; then
            jq --argjson cloud "$(cat data-fragments/cloud.json)" \
              '.commands |= (map(select(.name != "cloud")) + [$cloud])' \
              public/data.json > public/data.json.tmp
            mv public/data.json.tmp public/data.json
          else
            echo "no data-fragments/cloud.json found, skipping merge"
          fi

      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: update rpk command tree'
          title: 'chore: update rpk command tree'
          body: |
            Automated weekly update of `public/data.json` from `rpk --print-tree`.
          branch: bot/update-rpk-tree
          delete-branch: true
          add-paths: public/data.json
